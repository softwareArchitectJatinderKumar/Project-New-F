            </td>
          </tr>

    <div class="admin-pagination" *ngIf="totalPages > 1">

      </button>
      <button class="pg-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">Next ›</button>
    </div>
  </div>
</div>
