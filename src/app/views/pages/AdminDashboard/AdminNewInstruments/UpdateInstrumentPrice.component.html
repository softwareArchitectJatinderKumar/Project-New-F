<app-AdminDashboard></app-AdminDashboard>

<div *ngIf="loadingIndicator" class="fullscreen-loader d-none">
    <div class="custom-spinner-overlay" *ngIf="loadingIndicator">
        <div class="custom-spinner-content text-center">
            <img src="assets/images/spinner.gif" alt="Loading..." />
        </div>
    </div>
</div>

<div class="row">
    <div class="  mb-5 mt-4 ">
        <div class="row">
            <h2 class="text-center ">Update Image(s)</h2>
        </div>

        <div class="row my-3">
            <div class="col-4 mb-2">
                <div class="text-md-center">
                    <button (click)="exportToExcel()" class="btn btn-dark"
                        [disabled]="this.TempAllInstrumentsDetails.length == 0">
                        Export to Excel
                    </button>
                </div>
            </div>
            <div class="col-4">
                <div class="text-center text-md-end">
                    <input [(ngModel)]="searchQueryx" (keyup)="searchx()" id="searchx" type="text" class="form-control"
                        placeholder="Type Search Text" aria-label="Search" />
                </div>
            </div>
            <div class="col-4">
                <div class="text-center text-md-end">
                </div>
            </div>
        </div>

        <div class="row m-2 p-2">
            <div class="col-12 mt-3">
                <ngx-datatable class="bootstrap table table-hover custom-datatable" [rows]="TempAllInstrumentsDetails"
                    [loadingIndicator]="loadingIndicator" [columnMode]="ColumnMode.force" [footerHeight]="50"
                    [limit]="10" [headerHeight]="60" [rowHeight]="'auto'">

                    <!-- <ngx-datatable-column name="Instrument Name" prop="instrumentName">
                        <ng-template let-value="value" ngx-datatable-cell-template>
                            <span class="text-wrap-cell">{{ value }}</span>
                        </ng-template>
                    </ngx-datatable-column> -->
                    <!-- Dynamic Columns -->
                    <ngx-datatable-column *ngFor="let col of columns" [prop]="col" [name]="col"></ngx-datatable-column>

                    <!-- Download Excel Column -->
                    <ngx-datatable-column name="Excel Sheet" [sortable]="false" [width]="150">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <div class="text-center">
                                <button *ngIf="row.excelSheetUrl" class="btn btn-outline-success btn-sm action-btn"
                                    (click)="onSelectSampleExcelFile(row)" title="Download Excel">
                                    <i class="bi bi-file-earmark-excel fs-6"></i>
                                </button>
                                <span *ngIf="!row.excelSheetUrl" class="badge bg-light text-muted border">N/A</span>
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- Download Image Column -->
                    <ngx-datatable-column name="Image" [sortable]="false" [width]="120">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <div class="text-center">
                                <button *ngIf="row.imageUrl" class="btn btn-outline-info btn-sm action-btn"
                                    (click)="onSelectFile(row)" title="Download Image">
                                    <i class="bi bi-image fs-6"></i>
                                </button>
                                <span *ngIf="!row.imageUrl" class="badge bg-light text-muted border">N/A</span>
                            </div>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- Instrument Status -->
                    <ngx-datatable-column name="Status" [sortable]="true" prop="isActive">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <span class="status-indicator" [ngClass]="row.isActive ? 'active' : 'inactive'">
                                <i class="bi"
                                    [ngClass]="row.isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
                                {{ row.isActive ? 'Available' : 'Unavailable' }}
                            </span>
                        </ng-template>
                    </ngx-datatable-column>

                    <!-- Actions -->
                    <ngx-datatable-column name="Actions" [sortable]="false">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <button class="btn btn-dark btn-sm px-3 shadow-sm" (click)="onSelect(row)">
                                Take Action
                            </button>
                        </ng-template>
                    </ngx-datatable-column>

                </ngx-datatable>
            </div>

        </div>
    </div>
    <ng-template #loginFailed>
        <div class="text-center bg-danger" *ngIf="isLoginFailed">
            <h3 class="text-center fs-2 m-5 text-warn pt-5 "> Error in User Login . </h3>
            <div class="row mt-4 mb-4">
                <div class="col-sm-12 text-center">
                    <div class="mb-3 p-4">
                        <Label class="form-label fs-4 text-warn ">Something Went Wrong. Please Try login again!.</Label>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
    <ng-template #viewDescModal let-modal>
        <div class="modal-header bg-light">
            <h5 class="modal-title d-flex align-items-center" id="exampleModalLabel">
                <i class="bi bi-pencil-square me-2 text-primary"></i>
                Modify Instrument: <span class="ms-2 text-dark fw-bold">{{this.InstrumentTitles}}</span>
            </h5>
            <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
        </div>

        <div class="modal-body p-4">
            <form id="UpdateImage">
                <div class="row align-items-end">

                    <!-- Instrument ID Display -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label text-muted small text-uppercase fw-bold">Instrument Id</label>
                        <div class="h6 fw-bold text-primary">{{this.InstrumentId}}</div>
                    </div>

                    <!-- Status Toggle -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label text-muted small text-uppercase fw-bold">Availability</label>
                        <div class="form-check form-switch pt-1">
                            <input class="form-check-input" type="checkbox" id="StatusInstrument"
                                name="StatusInstrument" [(ngModel)]="StatusInstrument" (change)="ChangeStatus($event)"
                                role="switch">
                            <label class="form-check-label" for="StatusInstrument">
                                {{ StatusInstrument ? 'Available' : 'Unavailable' }}
                            </label>
                        </div>
                    </div>

                    <!-- File Upload -->
                    <div class="col-md-4 mb-3">
                        <label for="File" class="form-label text-muted small text-uppercase fw-bold">Update Instrument
                            Image</label>
                        <input class="form-control" [(ngModel)]="fileNamesX" type="file" id="File" name="file"
                            (change)="onFileXSelected($event, this.InstrumentId)" accept=".png, .jpg, .jpeg" />
                        <div *ngIf="isForm1Submitted && !fileNamesX" class="text-danger small mt-1">
                            Please select an image file.
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="col-md-2 mb-3 text-end">
                        <button type="submit" [disabled]="!fileChosen[this.InstrumentId]"
                            class="btn btn-primary w-100 shadow-sm" (click)="UpdateFileDocument(this.InstrumentId);">
                            <i class="bi bi-cloud-upload me-1"></i> Upload
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </ng-template>
