    <!-- Loading state - show placeholder while checking mount status -->
<div *ngIf="!isMounted" style="min-height: 80px;"></div>

<!-- Loading indicator while fetching footer -->
<div *ngIf="isMounted && loading" class="loading-container">
  <div class="loading-spinner"></div>
</div>

<!-- Error state - show alert when footer is unavailable -->
<div *ngIf="isMounted && error && !loading" class="error-alert">
  <p>External footer Unavailable</p>
</div>

<!-- Remote footer content -->
<div 
  *ngIf="isMounted && footerHtml && !loading" 
  id="remote-footer-wrapper" 
  [innerHTML]="footerHtml">
</div>
