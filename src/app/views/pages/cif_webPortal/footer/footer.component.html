 
<div *ngIf="!isMounted" style="min-height: 80px;"></div>

 
<div *ngIf="isMounted && loading" class="loading-container">
  <div class="loading-spinner"></div>
  <p>Loading footer...</p>
</div>

 
 
<div 
  *ngIf="isMounted && footerHtml && !loading" 
  id="remote-footer-wrapper" 
  [innerHTML]="footerHtml">
</div>
