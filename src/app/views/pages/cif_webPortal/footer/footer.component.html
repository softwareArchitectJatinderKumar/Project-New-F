<div class="mt-auto">
  <div *ngIf="loading" class="text-center py-3 bg-light border-top">
    <div class="spinner-grow spinner-grow-sm text-secondary"></div>
  </div>

  <div *ngIf="error && !loading" class="text-center py-2 border-top small text-muted">
    Footer data paused. <a href="javascript:void(0)" (click)="fetchFooter()">Reload</a>
  </div>

  <div *ngIf="footerHtml && !loading" [innerHTML]="footerHtml"></div>

  <button *ngIf="showGotoTop" (click)="scrollToTop()" 
          class="btn btn-danger position-fixed bottom-0 end-0 m-4 rounded-circle shadow"
          style="width: 40px; height: 40px; z-index: 999;">
    ↑
  </button>
</div>
