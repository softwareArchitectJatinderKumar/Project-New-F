 <main aria-label="Upcoming events" class="vertical-marquee-wrapper bg-dark-yellow">
<div class="container"> 
  <header class="marquee-header">
    <h2>Upcoming Events</h2>
  </header>

  <section class="vertical-marquee" role="region" aria-live="polite" aria-atomic="true" aria-relevant="all" tabindex="0">
    <ul class="vertical-marquee-list m-4" aria-label="List of upcoming events">
      <li class="vertical-marquee-item" *ngFor="let event of allEvents">
        <article class="event-card" (click)="goToEvent(event)">
          <h3 class="event-title">{{ event.eventName }}</h3>
          <time class="event-date" [attr.datetime]="event.eventDateISO">{{ event.eventDate }}</time>
          <p class="event-details">{{ event.eventDetails }}</p>
          <button class="btn-dark w-20 " (click)="goToEvent(event)"  >
            Check
          </button>
        </article>
      </li>
    </ul>
  </section>
  </div>
</main>  

<main aria-label="Upcoming events" class="vertical-marquee-wrapper bg-dark-yellow">
    <div class="container p-4">
        <header class="marquee-header">
            <h2>Upcoming Events</h2>
        </header>
        <section class="vertical-marquee mb-5" role="region" aria-live="polite" aria-atomic="true" aria-relevant="all"
            tabindex="0">
            <ul class="vertical-marquee-list mt-5" aria-label="List of upcoming events">
                <li class="vertical-marquee-item " *ngFor="let event of allEvents">
                    <article class="eventX-card">
                        <!-- Left Column: Text Info -->
                        <div class="eventX-content">
                            <h3 class="eventX-title">{{ event.eventName }} </h3>
                            <time class="eventX-date" [attr.datetime]="event.eventDateISO">{{ event.eventDate }}</time>
                            <!-- <p class="eventX-details">{{ event.eventDetails }}</p> -->

                            <a href="#" (click)="goToEventC(event.eventId); $event.preventDefault()" class="btnX-check" >  View Details </a>
                            <!-- <button class="btnX-check" (click)="goToEvent(event.id)"
                                [attr.aria-label]="'Check details for ' + event.eventName">
                                Check
                            </button> -->
                        </div>

                        <!-- Right Column: Image -->
                        <div class="eventX-image-wrapper">
                            <img [src]="serverUrl + event.imageUrl" [alt]="event.eventName" class="event-image" />
                        </div>
                    </article>
                </li>

            </ul>
        </section>
    </div>
</main>
