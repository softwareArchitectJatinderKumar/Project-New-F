<section class="section ">
    <div class="container mb-4">
        <div class="heading-wraper">
            <div class="main-head d-flex align-items-center justify-content-between">
                <h2 class="mb-0">Upcoming Events</h2>

                <!-- <div class="slider-custom-nav">
                    <button class="single-prev-arrow custom-prev-arrow prev_custom-nav" (click)="prev()"
                        aria-label="Previous slide">
                        <img src="https://www.lpu.in/lpu-assets/images/icons/vector-left.svg" alt="prev" />
                    </button>

                    <button class="single-next-arrow custom-next-arrow next_custom-nav" (click)="next()"
                        aria-label="Next slide">
                        <img src="https://www.lpu.in/lpu-assets/images/icons/vector-right.svg" alt="next" />
                    </button>
                </div> -->
            </div>
        </div>
        <div *ngIf="allEvents.length>0; else ErrorCard">
        <ngb-carousel #ngbCarousel [interval]="autoSlideInterval" [pauseOnHover]="true" [wrap]="true"
            [showNavigationArrows]="false" [showNavigationIndicators]="false">
            <ng-template ngbSlide *ngFor="let event of allEvents; let i = index" id="{{ 'slide-' + i }}">
                <div class="slider-item event-card mb-4 bg-dark-yellow">
                    <div class="row">
                        <div class="col-md-12 text-start">
                            <h4 class="font-primary">{{ event.eventName }}</h4>
                            <div class="misc-smfont mt-3"><b>Date:</b> {{ event.eventDate }}</div>
                        </div>
                    </div>
                </div>
            </ng-template>
        </ngb-carousel>
        </div>
    </div>
</section> 
 <ng-template #ErrorCard>
            <div class="alert alert-danger card mt-3" role="alert">
                <div class="card-body text-center">
                    <h5 class="card-title">Server Connection Error</h5>
                    <p class="card-text">Data Server Connection error , Try again later</p>
                    <!-- <span class=" " (click)="serverConnectionError = false; loginError = null">Try  Again</span> -->
                </div>
            </div>
        </ng-template>
