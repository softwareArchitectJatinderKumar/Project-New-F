<section class="section">
    <div class="row  auth-page">
        <div class="container">
                <div class="row">
                    <div class="col-md-6 d-lg-block d-none">
                        <div class="auth-side-wrapper"
                            [ngStyle]="{ 'background-image': 'url(https://www.lpu.in/lpu-assets/images/cif/login-left.png)' }">
                        </div>
                        <a routerLink="/AdminLogin" class="p-2 mt-3 fs-5 text-end text-muted">.. </a>
                    </div>
                    <!-- <div class="col-md-8 ps-md-0"> -->
                    <!-- <div class="col-md-6 d-lg-block"> -->
                    <div class="col-md-6 login-div d-flex justify-content-around">
                        <div class="auth-form-wrapper px-4 py-5">
                            
                            <h2 class="text-dark fw-normal mb-4 text-center "> Welcome to <span class="ms-1 ">CIF </span> <span>Portal</span></h2>
                            <form class="forms-sample" [formGroup]="formdata" (ngSubmit)="OnSubmit()">
                                <div class="row mb-3 mt-3">
                                    <div class="col-sm-6"><label for="exampleInputEmail1" class="form-label fs-5">Email address</label> </div>
                                    <div class="col-sm-6"><input type="email" formControlName="Email" placeholder="Enter Email or User Id "
                                        class="form-control" id="exampleInputEmail1"> </div>
                                </div>
                                <div class="mb-3 row">
                                    <div class="col-sm-6"> <label for="exampleInputPassword1" class="fs-5 form-label">Password</label> </div>
                                    <div class="col-sm-6"><input type="password" formControlName="password" class="form-control"
                                        placeholder="Enter Password" id="exampleInputPassword1"
                                        autocomplete="current-password"> </div>
                                </div>
                                <div class="mb-3 row">
                                    <div class="col-sm-6"><label class="form-check-label fs-5" for="authCheck"> Choose Role </label> </div>
                                    <div class="col-sm-6"><select class="form-select" formControlName="UserRoleS"
                                        (change)="CheckUserType($event)">
                                        <option value="Select">Select Role</option>                                        
                                        <option value="400001">External Academia</option>
                                        <option value="400002">Industry User</option>
                                    </select> </div>
                                </div>
                                <div class="row mt-3 mb-2">
                                <div class="col-sm-6"> <span *ngIf="userRole && userRole.invalid && userRole.touched">Field Required</span> </div>
                                <div class="col-sm-6">  <span class="mt-4 text-danger fs-5">* All Field Required</span> </div>
                                </div>
                                <div class="mb-5 mt-5">

                                    <button type="submit" class="btn btn-danger btn-icon-text mb-2 me-5 mb-md-0"
                                        [disabled]=formdata.invalid>
                                        Submit or Login </button>
                                    <a routerLink="/signup" class="btn btn-dark btn-icon-text mb-2 mb-md-0 ">Not a user? Sign up</a>
                                </div>
                                <a routerLink="/InternalUserLogin" class="btn btn-danger btn-icon-text mb-2 mb-md-0">LPU User Login</a>
                                <a routerLink="/recoverAccount" class="btn btn-dark btn-icon-text mb-2 ms-5 mb-md-0"> Recover Password</a>

                            </form>
                        </div>
                    </div>
                </div>
        </div>
    </div>
    
</section>
