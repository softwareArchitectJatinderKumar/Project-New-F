<div *ngIf="isMounted">
  <div *ngIf="loading" class="text-center py-4 border-bottom">
    <div class="spinner-border text-danger" role="status"></div>
  </div>

  <div *ngIf="error && !loading" class="alert alert-light border text-center m-0 py-4">
    <h6 class="fw-bold text-dark">External Header Unavailable</h6>
    <button class="btn btn-sm btn-outline-dark mt-2" (click)="fetchHeader()">Retry</button>
  </div>

  <div *ngIf="headerHtml && !loading" id="remote-header-wrapper" [innerHTML]="headerHtml"></div>
</div>
