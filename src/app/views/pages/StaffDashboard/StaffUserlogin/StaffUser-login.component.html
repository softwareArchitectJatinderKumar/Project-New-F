<app-HomePageTopBar (facilitiesClicked)="gotoFacilities()"></app-HomePageTopBar>
<section class="login-section d-flex align-items-center">
  <div class="container">
    <div class="heading-wrapper LoginCards text-center">
       <h1 class="fs-2 text-maroon">Central Instrumentation Facility - Staff Login</h1>
     </div>
     <div class="row align-items-center justify-content-between gap-5">
      <div class="col-lg-6 d-none d-lg-block text-center">
        <img src="https://www.lpu.in/lpu-assets/images/cif/login-left.png" 
             class="img-fluid floating-img" 
             alt="Staff Portal Illustration" />
      </div>

      <div class="col-md-12 col-lg-5">
        <div class="login-card shadow-lg p-4 p-md-5  rounded-4" >
          <div class="text-center mb-4">
            <h2 class="fw-bold text-maroon">Staff Login</h2>
             <!-- <p class="text-warning fw-bold fs-4 mt-2 ">Central Instrumentation Facility</p> -->
          </div>

          <div class="alert alert-danger py-2 mb-4" *ngIf="ErrMessage.length > 0">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ErrMessage}}
          </div>

          <form [formGroup]="formdata" (ngSubmit)="OnSubmit()">
            
            <div class="mb-3">
              <label class="form-label fw-semibold" for="loginid">Staff User Id</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                <input type="text" class="form-control ps-3" 
                       placeholder="Enter Staff ID" 
                       formControlName="Email" id="loginid" />
              </div>
              <div *ngIf="submitted || email?.touched" class="text-danger mt-1">
                <small *ngIf="email?.errors?.['required']">User ID is required.</small>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" for="password">Password</label>
              <div class="input-group position-relative">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                <input [type]="showPassword ? 'text' : 'password'" 
                       class="form-control ps-3 pe-5" 
                       placeholder="••••••••" 
                       formControlName="password" id="password" />
                <button type="button" class="btn btn-eye-toggle position-absolute end-0 top-0 h-100" 
                        (click)="togglePasswordVisibility()">
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  <!-- <span class="small">{{ showPassword ? 'Hide' : 'Show' }}</span> -->
                </button>
              </div>
              <div *ngIf="submitted || passwordText?.touched" class="text-danger mt-1">
                <small *ngIf="passwordText?.errors?.['required']">Password is required.</small>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-maroon btn-lg" 
                      [disabled]="formdata.invalid">
                Submit
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</section>
